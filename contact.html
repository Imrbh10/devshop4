<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    line-height: 1.6;
  }
  header {
    background: #1f2937;
    color: #fff;
    padding: 1.2rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 1.4rem; }
  nav a {
    color: #fff;
    text-decoration: none;
    margin-left: 1.5rem;
    font-size: 0.95rem;
  }
  nav a:hover { text-decoration: underline; }
  .contact-hero {
    text-align: center;
    padding: 3rem 2rem;
    background: #2563eb;
    color: #fff;
  }
  .contact-hero h2 { font-size: 2rem; }
  main {
    max-width: 900px;
    margin: 3rem auto;
    padding: 0 1.5rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
  }
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; }
  }
  .info, .form-box {
    background: #fff;
    padding: 1.8rem;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .info h3, .form-box h3 {
    color: #2563eb;
    margin-bottom: 1rem;
  }
  .info p {
    margin-bottom: 0.8rem;
    font-size: 0.95rem;
  }
  label {
    display: block;
    margin-bottom: 0.4rem;
    font-weight: bold;
    font-size: 0.9rem;
  }
  input, textarea {
    width: 100%;
    padding: 0.6rem;
    margin-bottom: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.95rem;
  }
  button {
    width: 100%;
    padding: 0.8rem;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover {
    background: #1d4ed8;
  }
  footer {
    text-align: center;
    padding: 1.5rem;
    color: #666;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <h1>MySite</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="contact-hero">
  <h2>Contact Us</h2>
  <p>We'd love to hear from you. Reach out anytime.</p>
</section>

<main>
  <div class="info">
    <h3>Get in Touch</h3>
    <p>📍 123 Main Street, City, Country</p>
    <p>📞 +1 (555) 123-4567</p>
    <p>✉️ contact@mysite.com</p>
    <p>🕑 Mon - Fri: 9am - 6pm</p>
  </div>

  <div class="form-box">
    <h3>Send a Message</h3>
    <form>
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Your email" required>

      <label for="message">Message</label>
      <textarea id="message" rows="4" placeholder="Your message" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>
</main>

<footer>
  &copy; 2026 MySite. All rights reserved.
</footer>

</body>
</html>
